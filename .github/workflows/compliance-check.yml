name: Compliance check

# Compliance gate for viavitae-clients.
#
# Four independent checks plus an aggregate status job:
#   secrets        — TruffleHog --only-verified over full history
#   licences       — allow-list scan (Python + JS/TS)
#   governance     — required files presence and validity
#   action-pinning — every uses: must be a 40-char commit SHA (rule R4)
#
# LEAST-PRIVILEGE TOKEN
#   contents: read by default. Only licences escalates to pull-requests: write.

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "compliance-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  ALLOWED_LICENCES: "MIT Apache-2.0 BSD-2-Clause BSD-3-Clause 0BSD ISC CC0-1.0 Unlicense Python-2.0 Proprietary"
  FORBIDDEN_LICENCES: "GPL-2.0 GPL-3.0 AGPL-3.0 LGPL-2.1 LGPL-3.0 MPL-2.0 EPL-1.0 EPL-2.0 CDDL-1.0 SSPL-1.0 BUSL-1.1"
  REVIEW_LABEL: "compliance/licence-review"

jobs:
  # ---------------------------------------------------------------------------
  # secrets — TruffleHog --only-verified (full history, no licence required)
  # ---------------------------------------------------------------------------
  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: TruffleHog (full history, verified only)
        uses: trufflesecurity/trufflehog@080c22fb8ea3107163b9dbcc33396a41c518b990 # main
        with:
          path: ./
          extra_args: --only-verified

      - name: Confirm the scan ran
        if: failure()
        run: |
          echo "::error::TruffleHog reported a verified secret. Rotate it immediately."
          echo "Never resolve by adding to .truffleignore without security approval."
          exit 1

  # ---------------------------------------------------------------------------
  # licences — allow-list enforcement
  # ---------------------------------------------------------------------------
  licences:
    name: Licence compliance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Detect manifests
        id: manifests
        run: |
          set -euo pipefail
          python_manifests=0; node_manifests=0
          [ -f pyproject.toml ] || compgen -G "requirements*.txt" >/dev/null && python_manifests=1
          [ -f package-lock.json ] && node_manifests=1
          echo "python=$python_manifests" >> "$GITHUB_OUTPUT"
          echo "node=$node_manifests" >> "$GITHUB_OUTPUT"

      - name: Install dependencies for licence resolution
        if: steps.manifests.outputs.python == '1' || steps.manifests.outputs.node == '1'
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install pip-licenses
          [ -f requirements.txt ] && pip install -r requirements.txt || true
          [ -f package-lock.json ] && npm ci --no-audit --no-fund || true

      - name: Python licence report
        if: steps.manifests.outputs.python == '1'
        run: |
          set -uo pipefail
          pip-licenses --format=json --with-urls > python-licences.json
          python - <<'PY'
          import json, os, sys
          allowed = set(os.environ["ALLOWED_LICENCES"].split())
          forbidden = set(os.environ["FORBIDDEN_LICENCES"].split())
          rows = json.load(open("python-licences.json"))
          bad, review = [], []
          for r in rows:
              lic = (r.get("License") or "").strip()
              name, ver = r.get("Name", "?"), r.get("Version", "?")
              if not lic or lic in ("UNKNOWN", "(unknown license)"):
                  review.append(f"{name}=={ver}: licence not declared")
                  continue
              tokens = lic.replace("/", " ").replace(",", " ").replace(" or ", " ").split()
              if any(t.strip("()") in forbidden for t in tokens):
                  bad.append(f"{name}=={ver}: FORBIDDEN licence '{lic}'")
              elif not any(t.strip("()") in allowed for t in tokens):
                  review.append(f"{name}=={ver}: unrecognised licence '{lic}'")
          for line in bad: print(f"::error::{line}")
          for line in review: print(f"::warning::{line}")
          with open("licence-review.txt", "a") as fh:
              fh.writelines(f"python: {line}\n" for line in review)
          with open("licence-failures.txt", "a") as fh:
              fh.writelines(f"python: {line}\n" for line in bad)
          if bad: sys.exit(1)
          PY

      - name: Fail on unknown licences
        run: |
          set -uo pipefail
          if [ -s licence-review.txt ]; then
            echo "::error::Unknown licences present. Resolve or record as ADR."
            exit 1
          fi
          echo "All licences resolved on the allow list."

  # ---------------------------------------------------------------------------
  # governance — required files present and valid
  # ---------------------------------------------------------------------------
  governance:
    name: Governance files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify required governance files
        run: |
          set -uo pipefail
          missing=0
          for f in README.md LICENSE SECURITY.md CONTRIBUTING.md CHANGELOG.md \
                   QODER.md .gitignore .editorconfig .yamllint.yml \
                   .github/CODEOWNERS .github/dependabot.yml \
                   .github/PULL_REQUEST_TEMPLATE.md \
                   docs/architecture.md docs/DPIA-template.md; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required governance file: $f"
              missing=1
            elif [ ! -s "$f" ]; then
              echo "::error::Required governance file is empty: $f"
              missing=1
            else
              echo "present: $f"
            fi
          done
          exit "$missing"

      - name: Verify CODEOWNERS is not empty and has a default owner
        run: |
          set -uo pipefail
          file=.github/CODEOWNERS
          effective=$(grep -vE '^\s*(#|$)' "$file" || true)
          if [ -z "$effective" ]; then
            echo "::error::CODEOWNERS contains no effective rules."
            exit 1
          fi
          if ! printf '%s\n' "$effective" | grep -qE '^\*\s+@'; then
            echo "::error::CODEOWNERS has no '* @...' default rule."
            exit 1
          fi
          if printf '%s\n' "$effective" | grep -qE '@org/|<OWNER_HANDLE>|@your-org|viavitae-org'; then
            echo "::error::CODEOWNERS still contains template placeholders."
            exit 1
          fi

      - name: Verify .editorconfig declares root
        run: |
          set -uo pipefail
          grep -qE '^root\s*=\s*true' .editorconfig || {
            echo "::error::.editorconfig must declare 'root = true'."
            exit 1
          }

      - name: Verify .gitignore covers secrets and state
        run: |
          set -uo pipefail
          required=('\.env' '\.venv/?' '\*\.pem' '\*\.key' 'secrets/?')
          failed=0
          for pattern in "${required[@]}"; do
            if ! grep -qE "^!?${pattern}" .gitignore; then
              echo "::error::.gitignore does not cover '${pattern}'."
              failed=1
            fi
          done
          exit "$failed"

  # ---------------------------------------------------------------------------
  # action-pinning — rule R4 enforcement
  # ---------------------------------------------------------------------------
  action-pinning:
    name: Action SHA pinning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify every action reference is SHA-pinned
        run: |
          set -uo pipefail
          unpinned=0; total=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            total=$((total + 1))
            file=${line%%:*}
            rest=${line#*:}
            lineno=${rest%%:*}
            ref=$(printf '%s' "$rest" | sed -E 's/.*uses:\s*//; s/\s*#.*//; s/\s*$//')
            case "$ref" in ./*|./.github/*) continue ;; esac
            if ! printf '%s' "$ref" | grep -qE '@[0-9a-f]{40}$'; then
              echo "::error file=${file},line=${lineno}::Unpinned action '${ref}'. Rule R4 requires a 40-char SHA."
              unpinned=$((unpinned + 1))
            fi
          done < <(grep -rn --include='*.yml' --include='*.yaml' -E '^\s*(-\s+)?uses:\s*\S+' .github/workflows .github/actions 2>/dev/null | grep -v '^\s*#')
          echo "action references checked: ${total}; unpinned: ${unpinned}"
          if [ "${unpinned}" -ne 0 ]; then
            echo "::error::${unpinned} action reference(s) not SHA-pinned."
            exit 1
          fi

      - name: Verify least-privilege permissions
        run: |
          set -uo pipefail
          failed=0
          for f in .github/workflows/*.yml; do
            grep -qE '^permissions:' "$f" || { echo "::error file=${f}::No 'permissions:' block."; failed=1; }
            grep -qE '^\s*permissions:\s*(write-all|read-all)\s*$' "$f" && { echo "::error file=${f}::write-all/read-all forbidden."; failed=1; }
          done
          exit "${failed}"

  # ---------------------------------------------------------------------------
  # compliance-status — single required check for branch protection
  # ---------------------------------------------------------------------------
  compliance-status:
    name: Compliance status
    needs: [secrets, licences, governance, action-pinning]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Evaluate compliance gates
        run: |
          set -uo pipefail
          results='${{ toJSON(needs) }}'
          printf '%s\n' "$results" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'
          failed=$(printf '%s\n' "$results" | jq '[to_entries[] | select(.value.result != "success" and .value.result != "skipped")] | length')
          if [ "$failed" -ne 0 ]; then
            echo "::error::${failed} compliance gate(s) did not succeed."
            exit 1
          fi
          echo "All compliance gates passed."
