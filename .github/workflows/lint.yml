name: Lint

# YAML lint, markdown lint and slug format check for viavitae-clients.

on:
  pull_request:
    paths:
      - "clients/**"
      - "policies/**"
      - "*.md"
      - ".yamllint.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "lint-${{ github.ref }}"
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  yaml-lint:
    name: YAML lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install yamllint
        run: pip install yamllint

      - name: Yamllint
        run: yamllint -c .yamllint.yml clients/ policies/

  slug-check:
    name: Slug format check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check slugs
        run: |
          set -euo pipefail
          python scripts/slug_check.py

  content-parity:
    name: Content parity (LT/EN/RU)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check content parity
        run: |
          set -euo pipefail
          python scripts/parity_check.py
