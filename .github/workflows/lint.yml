name: Lint

# YAML lint, markdown lint and slug format check for viavitae-clients.

on:
  pull_request:
    paths:
      - "clients/**"
      - "policies/**"
      - "*.md"
      - ".yamllint.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "lint-${{ github.ref }}"
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  yaml-lint:
    name: YAML lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install yamllint
        run: pip install yamllint

      - name: Yamllint
        run: yamllint -c .yamllint.yml clients/ policies/

  slug-check:
    name: Slug format check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check slugs
        run: |
          set -euo pipefail
          python scripts/slug_check.py

  content-parity:
    name: Content parity (LT/EN/RU)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check content parity
        run: |
          set -euo pipefail
          python scripts/parity_check.py
