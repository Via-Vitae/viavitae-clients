name: Validate tenants

# Validates every tenant.yaml against the master JSON Schema on each PR.
# Also runs referential checks: add-on requires tier, billing_ref exists, etc.

on:
  pull_request:
    paths:
      - "clients/**"
      - "schemas/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "validate-tenant-${{ github.ref }}"
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  validate:
    name: Schema + referential validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install pyyaml jsonschema

      - name: Validate all tenants
        run: |
          set -euo pipefail
          python scripts/validate_tenants.py

      - name: Check slug uniqueness
        run: |
          set -euo pipefail
          python scripts/slug_check.py

      - name: Check consent/DPIA compliance
        run: |
          set -euo pipefail
          python scripts/check_consent_dpias.py

      - name: Check data boundary
        run: |
          set -euo pipefail
          python scripts/check_data_boundary.py
