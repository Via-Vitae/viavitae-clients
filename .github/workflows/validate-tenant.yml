name: Validate tenants

# Validates every tenant.yaml against the master JSON Schema on each PR.
# Also runs referential checks: add-on requires tier, billing_ref exists, etc.

on:
  pull_request:
    paths:
      - "clients/**"
      - "schemas/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "validate-tenant-${{ github.ref }}"
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  validate:
    name: Schema + referential validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install pyyaml jsonschema

      - name: Validate all tenants
        run: |
          set -euo pipefail
          python scripts/validate_tenants.py

      - name: Check slug uniqueness
        run: |
          set -euo pipefail
          python scripts/slug_check.py

      - name: Check consent/DPIA compliance
        run: |
          set -euo pipefail
          python scripts/check_consent_dpias.py

      - name: Check data boundary
        run: |
          set -euo pipefail
          python scripts/check_data_boundary.py
