# Dependabot configuration for viavitae-clients
# Weekly grouped updates on Monday 06:00 Europe/Vilnius.

version: 2
updates:
  # GitHub Actions — workflow dependency updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Vilnius"
    open-pull-requests-limit: 10
    reviewers:
      - "JourneyOfLife"
      - "IterVitae"
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns:
          - "*"

  # Python — validation scripts dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Vilnius"
    open-pull-requests-limit: 10
    reviewers:
      - "JourneyOfLife"
      - "IterVitae"
    commit-message:
      prefix: "chore(deps)"
    groups:
      python:
        patterns:
          - "*"
